stages:
  - test

catalog-source-offline-tests:
  stage: test
  image: public.ecr.aws/docker/library/node:24.19.0
  needs: []
  interruptible: true
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # This job uses only checked-in fixtures. Do not add source fetches,
    # production references, credentials, schedules, or --apply here.
    - node scripts/catalog-sources/test-zzctea-contract.js
    - node scripts/catalog-sources/test-zzctea-connector.js
    - node scripts/catalog-sources/test-http.js
    - node scripts/catalog-sources/test-runtime.js
    - node scripts/catalog-sources/test-projection.js
    - node scripts/catalog-sources/test-projection-cli.js
    - node scripts/catalog-sources/test-update-zzctea-current.js
    - node scripts/catalog-sources/test-import-bundle.js
    - node scripts/catalog-sources/test-admin-console-artifact.js
    - node scripts/catalog-sources/test-product-translation-markdown.js
    - node scripts/catalog-sources/test-chinese-product-markdown.js
    - node scripts/catalog-sources/test-media-materialization.js
    - node scripts/catalog-sources/test-reconciliation-references.js
    - node scripts/catalog-sources/test-reconciliation.js
    - node scripts/catalog-sources/test-reconciliation-cli.js
    - node scripts/catalog-sources/test-commerce-publication.js

thetea-media-offline-tests:
  stage: test
  image: public.ecr.aws/docker/library/node:24.19.0
  needs: []
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Content-media validation is fully offline and uses generated temp fixtures.
    - node scripts/thetea/test-content-media.js
    - node scripts/thetea/test-artifact-bundle.js

thetea-package-offline-tests:
  stage: test
  image: public.ecr.aws/docker/library/node:24.19.0
  needs: []
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Package mapping, managed overlay, validation, generation safety, and
    # reconciliation run only against checked-in or generated temp fixtures.
    # Do not add network fetches, production references, or apply commands.
    - node scripts/thetea/test-transform.js
    - node scripts/thetea/test-category-taxonomy.js
    - node scripts/thetea/test-materialize-d1-snapshot.js
    - node scripts/thetea/test-validate-d1-snapshot.js
    - node scripts/thetea/test-product-overlay.js
    - node scripts/thetea/test-artifact-validator.js
    - node scripts/thetea/test-generate-safety.js
    - node scripts/thetea/test-reconcile-generated.js
    - node scripts/thetea/test-routed-content.js
    - node scripts/thetea/test-run-product-sync.js
